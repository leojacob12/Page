<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunsthalle AR Show!</title>

    <!-- Support für Safari -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.7.1/dist/es-module-shims.js"></script>

    <!-- Three.js -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.min.js"
      }
    }
    </script>

    <!-- Model Viewer -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer-module.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer-effects@1.5.0/dist/model-viewer-effects.min.js"></script>

    <style>
        @font-face {
            font-family: 'PrimusScript';
            src: url('./content/primusscript.ttf') format('truetype');
        }

        *{
            box-sizing:border-box;
        }

        body {
            background-image: url('./content/55K5OUB.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            color: white;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'PrimusScript', cursive;
            text-shadow: 4px 4px 0px #000;
            color: #FF0000;
            font-size: clamp(1.6rem, 6vw, 3rem);
            margin: 20px 0 10px;
            padding: 0 10px;
            line-height: 1.2;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        h2 {
            font-family: 'PrimusScript', cursive;
            text-shadow: 2px 2px 0px #000;
            color: #00FF00;
            font-size: clamp(1.1rem, 4vw, 1.8rem);
            margin: 12px 0;
            padding: 0 10px;
            line-height: 1.3;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .content-frame {
            width: 50%;
            height: 70vh;
            border: 5px solid #FF0000;
            background-image: url('./content/windi.gif');
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 15%;
            left: 25%;
            z-index: -1;
        }

        /* Jahreszahl über dem windi.gif */
        .year-overlay {
            position: absolute;
            top: 15%;
            left: 25%;
            width: 50%;
            margin: 0;
            padding: 10px 10px 0;
            z-index: 1;
        }

        model-viewer {
            width: 100%;
            height: 65vh;
            display: block;
            margin: 0 auto;
        }

        .footer-text {
            margin-top: 9vh;
        }

   


        /* ===========================
           MOBILE
           =========================== */

        @media (max-width:768px){

            h1{
                font-size:clamp(1.3rem, 7vw, 1.9rem);
                margin:10px 0 0;
                padding: 0 8px;
            }

            h2{
                font-size:clamp(1rem, 5vw, 1.3rem);
                margin:5px 0;
                padding: 0 8px;
            }

        .content-frame{
    width:90%;
    height:50vh;
    left:5%;
    top:150px;
}

            .year-overlay{
                top:150px;
                left:5%;
                width:90%;
            }

            model-viewer{
                height:50vh;
            }

            .footer-text{
                margin-top: 4vh;
            }



            /* Deko-GIFs kleiner */

        .left-gif{
    width:120px !important;
    top:140px !important;
    left:5px !important;
}

        .right-gif{
    width:60px !important;
    right:5px !important;
    bottom:20px !important;
}

        }

    </style>
</head>

<body>

    <img
        src="./content/y7.gif"
        class="left-gif"
        style="position:absolute;left:5%;top:200px;width:150px;z-index:2;"
    >

    <div style="position:relative;z-index:1;">

        <h1>SEITEN AUS ANDEREN ZEITEN</h1>

        <div class="content-frame"></div>

        <h2 class="year-overlay">1984 - 2024</h2>

        <model-viewer
            id="pixel-model"
            src="content/ar.glb"
            ios-src="content/ar.usdz"
            alt="Kunsthalle AR Show"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            auto-rotate>

       

            <effect-composer>
                <pixelate-effect granularity="3"></pixelate-effect>
            </effect-composer>

        </model-viewer>

        <h2 class="footer-text">
            In Erinnerung an alte Computer-Grafiken
            <br>
            &amp; die Anfänge von CGI
        </h2>

    </div>

    <img
        src="./content/computer.gif"
        class="right-gif"
        style="position:absolute;right:5%;bottom:50px;width:100px;z-index:2;"
    >

</body>
</html>
